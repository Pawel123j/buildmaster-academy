name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint, typy, testy, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalacja zależności
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Kontrola typów
        # `next build` sprawdza typy tylko w plikach, które wciągnie do
        # bundla — testy i pliki pomocnicze zostają poza kontrolą.
        run: npm run typecheck

      - name: Testy
        run: npm test

      - name: Audyt zależności
        # Sprawdź aktualne advisory i istniejącą poprawkę źródłową;
        # nie traktuj wyniku poprzedniego audytu jako bieżącej gwarancji.
        run: npm run security:check

      - name: Build produkcyjny
        run: npm run build

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install -r e2e/requirements.txt
      - name: Browser regression tests
        run: python -m pytest -q e2e --junitxml=e2e/artifacts/results.xml
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-test-results
          path: e2e/artifacts/
