name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, typy, testy, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm

      - name: Instalacja zależności
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Kontrola typów
        # `next build` sprawdza typy tylko w plikach, które wciągnie do
        # bundla — testy i pliki pomocnicze zostają poza kontrolą.
        run: npm run typecheck

      - name: Testy
        run: npm test

      - name: Audyt zależności
        # Po naprawie zależności repozytorium ma 0 podatności, więc próg
        # `high` jest realny do utrzymania.
        run: npm run security:check

      - name: Build produkcyjny
        run: npm run build

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install -r e2e/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Browser regression tests
        run: python -m pytest -q e2e --junitxml=e2e/artifacts/results.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-test-results
          path: e2e/artifacts/
